<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERPENT PROTOCOL: Garden of Eden</title>
  <style>
    :root {
      --bg: #0f380f;
      --dark: #0f380f;
      --mid: #306230;
      --light: #8bac0f;
      --bright: #9bbc0f;
      --amber: #d9c16a;
      --red: #af2b2b;
      --gold: #d8a13a;
      --white: #e8f0d8;
      --shadow: rgba(0,0,0,0.45);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #060d07;
      color: var(--bright);
      font-family: "Courier New", monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #09160b 0%, #050b06 100%);
    }

    #game-shell {
      width: min(92vw, 960px);
      height: min(92vh, 720px);
      position: relative;
      border: 4px solid var(--bright);
      background: #071208;
      box-shadow: inset 0 0 0 4px rgba(155,188,15,0.18), 0 0 25px rgba(0,0,0,.45);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      background: #0f380f;
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="game" width="960" height="720"></canvas>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const CONFIG = {
        COLS: 24,
        ROWS: 24,
        CELL: 20,
        PLAY_X: 60,
        PLAY_Y: 100,
        BOARD_W: 480,
        BOARD_H: 480,
        GROWTH_PER_APPLE: 2,
        COMBO_WINDOW: 2500,
        GOLDEN_CHANCE: 0.08,
        MAX_COMBO: 4,
        TOUCH_DEADZONE: 26,
        DEFAULT_DIFFICULTY: 'normal'
      };

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const rand = (min, max) => Math.random() * (max - min) + min;
      const keyOf = (x, y) => x + ':' + y;
      const sameCell = (a, b) => a && b && a.x === b.x && a.y === b.y;

      const Storage = (() => {
        const KEY = 'serpent_protocol_eden_v1';
        const base = {
          unlockedLevel: 1,
          bestScores: {},
          lore: [],
          endings: { consume: false, refuse: false },
          unlocks: { endless: false, rivalMode: false },
          settings: {
            volume: 0.8,
            sfx: 0.8,
            shake: true,
            scanlines: true,
            difficulty: 'normal'
          }
        };

        function load() {
          try {
            const raw = localStorage.getItem(KEY);
            if (!raw) return JSON.parse(JSON.stringify(base));
            const parsed = JSON.parse(raw);
            return Object.assign(JSON.parse(JSON.stringify(base)), parsed);
          } catch (e) {
            return JSON.parse(JSON.stringify(base));
          }
        }

        function save(data) {
          try {
            localStorage.setItem(KEY, JSON.stringify(data));
          } catch (e) {
            // graceful fallback
          }
        }

        return { load, save };
      })();

      let SAVE = Storage.load();

      const Audio = (() => {
        let ctx = null;
        let masterGain = null;
        let musicTimer = null;
        let musicStep = 0;
        let act = 1;

        function ensureContext() {
          if (ctx) return;
          try {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return;
            ctx = new AudioCtor();
            masterGain = ctx.createGain();
            masterGain.gain.value = SAVE.settings.volume || 0.8;
            masterGain.connect(ctx.destination);
          } catch (e) {
            ctx = null;
            masterGain = null;
          }
        }

        function play(name, opt = {}) {
          if (!ctx || !masterGain) return;
          if (document.visibilityState === 'hidden') return;
          const table = {
            chomp: { type: 'square', duration: 0.07, start: 200, end: 420, gain: 0.2 },
            golden: { type: 'triangle', duration: 0.25, notes: [392, 523.25, 783.99], gain: 0.24 },
            turn: { type: 'square', duration: 0.012, start: 900, end: 700, gain: 0.06 },
            death: { type: 'sawtooth', duration: 0.55, start: 400, end: 60, gain: 0.18 },
            levelClear: { type: 'square', duration: 0.18, start: 350, end: 700, gain: 0.16 },
            rivalDown: { type: 'square', duration: 0.12, start: 220, end: 130, gain: 0.15 },
            menuMove: { type: 'square', duration: 0.03, start: 480, end: 560, gain: 0.08 },
            menuSelect: { type: 'square', duration: 0.05, start: 600, end: 820, gain: 0.12 }
          };
          const cfg = table[name] || { type: 'square', duration: 0.05, start: 300, end: 300, gain: 0.08 };
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          const dur = opt.duration || cfg.duration || 0.05;
          const start = opt.start || cfg.start || 300;
          const end = opt.end || cfg.end || start;
          const gain = (opt.gain ?? cfg.gain ?? 0.1) * (SAVE.settings.volume || 0.8);
          osc.type = opt.type || cfg.type || 'square';
          osc.frequency.setValueAtTime(start, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, end), now + dur);
          gainNode.gain.setValueAtTime(0.0001, now);
          gainNode.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), now + 0.01);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gainNode);
          gainNode.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        }

        function setAct(levelNum) {
          act = clamp(levelNum, 1, 12);
          if (ctx && !musicTimer) startMusic();
        }

        function startMusic() {
          if (!ctx || !masterGain) return;
          if (musicTimer) clearTimeout(musicTimer);
          const theme = [
            [220, 330, 392],
            [220, 294, 349],
            [196, 262, 392],
            [174, 246, 349]
          ];
          const seq = theme[(act - 1) % theme.length];
          const now = ctx.currentTime + 0.02;
          for (let i = 0; i < seq.length; i++) {
            const freq = seq[i];
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + i * 0.18);
            g.gain.setValueAtTime(0.0001, now + i * 0.18);
            g.gain.exponentialRampToValueAtTime(0.025, now + i * 0.18 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.12);
            osc.connect(g);
            g.connect(masterGain);
            osc.start(now + i * 0.18);
            osc.stop(now + i * 0.18 + 0.13);
          }
          musicTimer = setTimeout(startMusic, 1000);
        }

        function setMasterVolume(v) {
          if (masterGain) masterGain.gain.value = clamp(v, 0, 1);
        }

        function init() {
          ensureContext();
          if (ctx && ctx.state === 'suspended') ctx.resume();
          if (ctx && !musicTimer) startMusic();
        }

        return { ensureContext: ensureContext, init, play, setAct, setMasterVolume };
      })();

      const Input = (() => {
        let touchStart = null;

        function queueDirection(dir) {
          if (Game && typeof Game.queueDirection === 'function') {
            Game.queueDirection(dir);
          }
        }

        function onKeyDown(e) {
          const key = e.key;
          const code = e.code || key;
          const acceptedDirs = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','A','D','W','S'];
          if (acceptedDirs.includes(code) || acceptedDirs.includes(key)) e.preventDefault();

          if (key === ' ' || code === 'Space') {
            e.preventDefault();
            if (Game.state === 'TITLE') Game.confirmTitle();
            if (Game.state === 'INTRO') Game.advanceIntro();
            if (Game.state === 'CLEAR') Game.advanceClear();
            if (Game.state === 'ENDING') Game.chooseEnding();
            return;
          }

          if (key === 'Enter') {
            e.preventDefault();
            if (Game.state === 'TITLE') Game.confirmTitle();
            if (Game.state === 'INTRO') Game.advanceIntro();
            if (Game.state === 'CLEAR') Game.advanceClear();
            if (Game.state === 'DEAD') Game.retry();
            return;
          }

          if (key === 'Escape') {
            e.preventDefault();
            if (Game.state === 'PLAY' || Game.state === 'PAUSE') Game.togglePause();
            if (Game.state === 'LORE' || Game.state === 'OPTIONS' || Game.state === 'LEVEL_SELECT') Game.state = 'TITLE';
            return;
          }

          if (key === 'l' || key === 'L') {
            if (Game.state === 'TITLE') Game.enter('LORE');
            return;
          }

          if (key === 'ArrowLeft' || key === 'a' || key === 'A') queueDirection('left');
          if (key === 'ArrowRight' || key === 'd' || key === 'D') queueDirection('right');
          if (key === 'ArrowUp' || key === 'w' || key === 'W') queueDirection('up');
          if (key === 'ArrowDown' || key === 's' || key === 'S') queueDirection('down');

          if (key === 'ArrowUp') Game.menuMove(-1);
          if (key === 'ArrowDown') Game.menuMove(1);
        }

        function onTouchStart(e) {
          const t = e.changedTouches[0];
          touchStart = { x: t.clientX, y: t.clientY };
        }

        function onTouchEnd(e) {
          if (!touchStart) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - touchStart.x;
          const dy = t.clientY - touchStart.y;
          touchStart = null;
          const absX = Math.abs(dx), absY = Math.abs(dy);
          if (Math.max(absX, absY) < CONFIG.TOUCH_DEADZONE) return;
          if (absX > absY) {
            queueDirection(dx > 0 ? 'right' : 'left');
          } else {
            queueDirection(dy > 0 ? 'down' : 'up');
          }
        }

        document.addEventListener('keydown', onKeyDown, { passive: false });
        canvas.addEventListener('touchstart', onTouchStart, { passive: true });
        canvas.addEventListener('touchend', onTouchEnd, { passive: true });

        return { queueDirection, onKeyDown, onTouchStart, onTouchEnd };
      })();

      const Grid = {
        inBounds(x, y) {
          return x >= 0 && x < CONFIG.COLS && y >= 0 && y < CONFIG.ROWS;
        },
        rectCell(x, y) {
          return { x: CONFIG.PLAY_X + x * CONFIG.CELL, y: CONFIG.PLAY_Y + y * CONFIG.CELL, w: CONFIG.CELL, h: CONFIG.CELL };
        },
        cellCenter(x, y) {
          return { x: CONFIG.PLAY_X + x * CONFIG.CELL + CONFIG.CELL / 2, y: CONFIG.PLAY_Y + y * CONFIG.CELL + CONFIG.CELL / 2 };
        },
        randomFreeCell(snakeList, walls, appleList = []) {
          const blocked = new Set();
          for (const a of appleList) blocked.add(keyOf(a.x, a.y));
          for (const s of snakeList) {
            for (const seg of s.body) blocked.add(keyOf(seg.x, seg.y));
          }
          for (let tries = 0; tries < 600; tries++) {
            const x = Math.floor(Math.random() * CONFIG.COLS);
            const y = Math.floor(Math.random() * CONFIG.ROWS);
            if (walls && walls[x] && walls[x][y]) continue;
            if (blocked.has(keyOf(x, y))) continue;
            return { x, y };
          }
          return { x: 1, y: 1 };
        }
      };

      function makeSnake({x, y, dir, name, palette, player = false}) {
        const s = {
          name,
          player,
          palette,
          body: [{x, y}, {x: x - 1, y}, {x: x - 2, y}],
          direction: dir || 'right',
          queued: [],
          alive: true,
          growCount: 0,
          deltaColor: 0,
          ghost: false,
          respawnTimer: 0,
          type: player ? 'player' : 'rival',
          lastInput: null
        };

        s.head = () => s.body[0];
        s.tail = () => s.body[s.body.length - 1];
        s.length = () => s.body.length;

        s.grow = (n) => { s.growCount += n; };

        s.queueDirection = (dir) => {
          if (!dir) return;
          const map = { left: {x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
          const next = map[dir];
          const cur = map[s.direction];
          if (next && cur && (next.x === -cur.x && next.y === -cur.y)) return;
          if (s.queued.length < 2) {
            if (!s.queued.includes(dir)) s.queued.push(dir);
          }
        };

        s.consumeQueued = () => {
          if (!s.queued.length) return;
          const next = s.queued.shift();
          if (!next) return;
          const map = { left: {x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
          const cur = map[s.direction];
          const n = map[next];
          if (n && cur && (n.x === -cur.x && n.y === -cur.y)) return;
          s.direction = next;
        };

        s.step = (level, otherSnakes = []) => {
          const dirs = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
          if (s.queued.length) s.consumeQueued();

          const head = s.body[0];
          let nx = head.x + dirs[s.direction].x;
          let ny = head.y + dirs[s.direction].y;

          if (level.wrapEdges) {
            nx = (nx + CONFIG.COLS) % CONFIG.COLS;
            ny = (ny + CONFIG.ROWS) % CONFIG.ROWS;
          }

          const nextHead = { x: nx, y: ny };
          const nextKey = keyOf(nx, ny);

          let isWall = false;
          if (!level.wrapEdges && (!Grid.inBounds(nx, ny) || (level.walls && level.walls[nx] && level.walls[nx][ny]))) isWall = true;

          const selfCollision = s.body.slice(1).some(seg => seg.x === nx && seg.y === ny);
          const adjacentNeck = s.body[1] && s.body[1].x === nx && s.body[1].y === ny;

          let collidedRival = false;
          if (otherSnakes && otherSnakes.length) {
            for (const other of otherSnakes) {
              if (!other || other === s || !other.alive) continue;
              if (other.body.some(seg => seg.x === nx && seg.y === ny)) {
                collidedRival = true;
                break;
              }
            }
          }

          if (isWall || (selfCollision && !adjacentNeck) || collidedRival) {
            s.alive = false;
            return { dead: true, cause: isWall ? 'Wall' : collidedRival ? 'Rival' : 'Your own tail' };
          }

          s.body.unshift(nextHead);
          if (s.growCount > 0) s.growCount -= 1;
          else s.body.pop();
          return { dead: false };
        };

        return s;
      }

      const Levels = (() => {
        const list = [
          { id: 1, name: 'The First Bite', tick: 150, applesToClear: 5, wrapEdges: false, rivals: [], story: 'You wake in the Garden. The fruit remembers your name.', hazard: 'None', wallType: 'open' },
          { id: 2, name: 'Hedgerow', tick: 140, applesToClear: 6, wrapEdges: false, rivals: [], story: 'The Garden keeps its shape. Learn it or bruise against it.', hazard: 'Pillars', wallType: 'pillars' },
          { id: 3, name: 'Wrapped', tick: 135, applesToClear: 7, wrapEdges: true, rivals: [], story: 'The fence has no ends. Neither does hunger.', hazard: 'Wrap', wallType: 'wrapped' },
          { id: 4, name: 'The Rival Arrives', tick: 130, applesToClear: 6, wrapEdges: false, rivals: ['VIPER'], story: 'Something else is hungry. It learned by watching you.', hazard: 'Rival', wallType: 'open' },
          { id: 5, name: 'Narrow Paths', tick: 125, applesToClear: 8, wrapEdges: false, rivals: [], story: 'The Garden narrows where it is afraid.', hazard: 'Maze', wallType: 'maze' },
          { id: 6, name: 'The Hoarder', tick: 120, applesToClear: 7, wrapEdges: false, rivals: ['GRUB'], story: 'It does not eat to live. It lives to take.', hazard: 'Hoarder', wallType: 'blocks' },
          { id: 7, name: 'Ghost in the Wire', tick: 115, applesToClear: 8, wrapEdges: false, rivals: ['PHANTOM'], story: 'The dead protocol never stopped running.', hazard: 'Ghost', wallType: 'wire' },
          { id: 8, name: 'Speed Garden', tick: 95, applesToClear: 9, wrapEdges: false, rivals: ['VIPER'], story: 'Grow fast. The Garden is counting down.', hazard: 'Double apples', wallType: 'open' },
          { id: 9, name: 'Mirror Twin', tick: 115, applesToClear: 8, wrapEdges: false, rivals: ['ECHO'], story: 'It has your shape. It does not have your reasons.', hazard: 'Mirror', wallType: 'symmetry' },
          { id: 10, name: 'The Orchard Siege', tick: 105, applesToClear: 10, wrapEdges: false, rivals: ['GRUB', 'PHANTOM'], story: 'They came together. They are not allies.', hazard: 'Siege', wallType: 'siege' },
          { id: 11, name: 'Titan\'s Coil', tick: 100, applesToClear: 10, wrapEdges: true, rivals: ['TITAN'], story: 'The first serpent. It has eaten every apple you were promised.', hazard: 'Boss', wallType: 'ring' },
          { id: 12, name: 'The Last Apple', tick: 75, applesToClear: 6, wrapEdges: true, rivals: ['TITAN', 'VIPER', 'ECHO'], story: 'One fruit left. Take it and the Garden forgets you. Refuse and it remembers forever.', hazard: 'Finale', wallType: 'small' }
        ];

        function buildWallMap(type) {
          const map = {};
          const add = (x, y) => { if (!map[x]) map[x] = {}; map[x][y] = true; };

          if (type === 'open') return map;
          if (type === 'pillars') {
            const c = [[8,8],[15,8],[8,15],[15,15]];
            for (const [x,y] of c) for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) add(x+dx, y+dy);
            return map;
          }
          if (type === 'wrapped') return map;
          if (type === 'maze') {
            const lines = [[5,5,5,18],[18,5,18,18],[4,6,19,6],[4,17,19,17],[9,9,14,9],[9,14,14,14],[10,10,10,13],[13,10,13,13]];
            for (const [x1,y1,x2,y2] of lines) {
              const xMin = Math.min(x1,x2), xMax = Math.max(x1,x2);
              const yMin = Math.min(y1,y2), yMax = Math.max(y1,y2);
              for (let x=xMin; x<=xMax; x++) for (let y=yMin; y<=yMax; y++) add(x,y);
            }
            return map;
          }
          if (type === 'blocks') {
            const coords = [[5,5],[9,8],[13,12],[18,10],[18,17],[8,18],[12,19],[5,16]];
            for (const [x,y] of coords) add(x,y);
            return map;
          }
          if (type === 'wire') {
            const coords = [[4,4],[6,4],[18,4],[20,4],[4,19],[6,19],[18,19],[20,19],[10,10],[10,13],[13,10],[13,13],[5,11],[18,11],[5,12],[18,12]];
            for (const [x,y] of coords) add(x,y);
            return map;
          }
          if (type === 'symmetry') {
            const coords = [[8,5],[15,5],[11,8],[12,8],[8,18],[15,18],[11,15],[12,15],[6,10],[17,10],[6,13],[17,13]];
            for (const [x,y] of coords) add(x,y);
            return map;
          }
          if (type === 'siege') {
            const coords = [[6,6],[6,11],[6,16],[10,8],[14,8],[18,6],[18,11],[18,16],[10,15],[14,15],[11,11],[12,11]];
            for (const [x,y] of coords) add(x,y);
            return map;
          }
          if (type === 'ring') {
            for (let x=0; x<CONFIG.COLS; x++) for (let y=0; y<CONFIG.ROWS; y++) {
              if ((x===0 || x===CONFIG.COLS-1 || y===0 || y===CONFIG.ROWS-1) && x>3 && x<CONFIG.COLS-4 && y>3 && y<CONFIG.ROWS-4) add(x,y);
              if (x===11 || x===12 || y===11 || y===12) add(x,y);
            }
            return map;
          }
          if (type === 'small') {
            for (let x=4; x<CONFIG.COLS-4; x++) for (let y=4; y<CONFIG.ROWS-4; y++) {
              if ((x===4 || x===CONFIG.COLS-5 || y===4 || y===CONFIG.ROWS-5) && !((x>=8 && x<=15) && (y>=8 && y<=15))) add(x,y);
            }
            return map;
          }
          return map;
        }

        function getLevel(id) {
          const base = list[id - 1] || list[0];
          return {
            ...base,
            walls: buildWallMap(base.wallType),
            appleCount: (id === 8 || id === 10 || id === 12) ? 2 + (id === 12 ? 1 : 0) : 1
          };
        }

        return { list, getLevel };
      })();

      const RivalAI = (() => {
        const palettes = {
          VIPER: ['#8b1a1a', '#e04a4a'],
          GRUB: ['#6b4a12', '#d8a13a'],
          PHANTOM: ['#3d1a4d', '#b46ce0'],
          ECHO: ['#0f4d52', '#4fd8e0'],
          TITAN: ['#5a5a4a', '#e8e8d0']
        };

        function createRival(type, x, y) {
          const s = makeSnake({ x, y, dir: 'left', name: type, palette: palettes[type] || ['#8b1a1a', '#e04a4a'], player: false });
          s.typeName = type;
          s.strategy = type;
          s.alive = true;
          s.delay = 0;
          s.respawnTimer = 0;
          return s;
        }

        function chooseDirForRival(rival, player, apples, level, rivals) {
          const dirs = ['left','right','up','down'];
          const head = rival.head();

          if (rival.strategy === 'VIPER') {
            const pHead = player.head();
            if (pHead) {
              let best = null;
              let bestScore = -Infinity;
              const map = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
              for (const d of dirs) {
                const mv = map[d];
                const nx = head.x + mv.x;
                const ny = head.y + mv.y;
                let score = 0;
                const tx = pHead.x + (player.direction === 'left' ? -4 : player.direction === 'right' ? 4 : 0);
                const ty = pHead.y + (player.direction === 'up' ? -4 : player.direction === 'down' ? 4 : 0);
                score += -(Math.abs(nx - tx) + Math.abs(ny - ty));
                if (apples.some(a => a.x === nx && a.y === ny)) score += 8;
                if (rivals.some(r => r !== rival && r.alive && r.body.some(seg => seg.x === nx && seg.y === ny))) score -= 100;
                if (score > bestScore) { bestScore = score; best = d; }
              }
              if (best) return best;
            }
          }

          if (rival.strategy === 'GRUB') {
            let best = null; let bestDist = 9999;
            for (const apple of apples) {
              const d = Math.abs(apple.x - head.x) + Math.abs(apple.y - head.y);
              if (d < bestDist) { bestDist = d; best = apple; }
            }
            if (best) {
              const dx = best.x - head.x;
              const dy = best.y - head.y;
              if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'right' : 'left';
              return dy >= 0 ? 'down' : 'up';
            }
          }

          if (rival.strategy === 'PHANTOM') {
            let best = null; let bestDist = 9999;
            for (const apple of apples) {
              const d = Math.abs(apple.x - head.x) + Math.abs(apple.y - head.y);
              if (d < bestDist) { bestDist = d; best = apple; }
            }
            if (best) {
              const dx = best.x - head.x;
              const dy = best.y - head.y;
              if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'right' : 'left';
              return dy >= 0 ? 'down' : 'up';
            }
          }

          if (rival.strategy === 'ECHO') {
            if (player.queued.length > 0) {
              return player.queued[0];
            }
            return player.direction;
          }

          if (rival.strategy === 'TITAN') {
            const best = {
              left: {score: 0, dir: 'left'},
              right: {score: 0, dir: 'right'},
              up: {score: 0, dir: 'up'},
              down: {score: 0, dir: 'down'}
            };
            const map = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
            for (const d of dirs) {
              const mv = map[d];
              const nx = ((head.x + mv.x) + CONFIG.COLS) % CONFIG.COLS;
              const ny = ((head.y + mv.y) + CONFIG.ROWS) % CONFIG.ROWS;
              best[d].score = Math.random() * 5;
              if (apples.some(a => a.x === nx && a.y === ny)) best[d].score += 10;
              if (rivals.some(r => r !== rival && r.alive && r.body.some(seg => seg.x === nx && seg.y === ny))) best[d].score -= 100;
            }
            let chosen = 'right';
            let max = -Infinity;
            for (const d of dirs) {
              if (best[d].score > max) { max = best[d].score; chosen = d; }
            }
            return chosen;
          }

          let best = null;
          let bestScore = -Infinity;
          for (const d of dirs) {
            const map = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
            const mv = map[d];
            const nx = head.x + mv.x;
            const ny = head.y + mv.y;
            let score = Math.random() * 4;
            if (apples.some(a => a.x === nx && a.y === ny)) score += 10;
            if (rivals.some(r => r !== rival && r.alive && r.body.some(seg => seg.x === nx && seg.y === ny))) score -= 100;
            if (score > bestScore) { bestScore = score; best = d; }
          }
          return best || rival.direction;
        }

        return { createRival, chooseDirForRival };
      })();

      const Game = {
        state: 'BOOT',
        levelIndex: 1,
        currentLevel: null,
        tickAccumulator: 0,
        player: null,
        rivals: [],
        apples: [],
        particles: [],
        score: 0,
        applesEaten: 0,
        comboLevel: 1,
        comboTimer: 0,
        lastComboAt: 0,
        whisperText: '',
        whisperTimer: 0,
        narrativeIndex: 0,
        titleIndex: 0,
        pauseIndex: 0,
        deathCause: 'Wall',
        bootStartedAt: 0,
        message: '',
        deaths: 0,
        levelGoals: 0,
        goldenApple: null,
        goldenTimer: 0,
        storyText: '',
        reveal: 0,
        revealTimer: 0,
        endingChoice: null,
        screenShake: 0,
        lastTime: 0,

        enter(stateName) {
          this.state = stateName;
          this.message = '';
          if (stateName === 'BOOT') this.bootStartedAt = performance.now();
          if (stateName === 'TITLE') this.titleIndex = 0;
          if (stateName === 'INTRO') {
            const lvl = Levels.getLevel(this.levelIndex);
            this.storyText = lvl.story;
            this.reveal = 0;
            this.revealTimer = 0;
          }
          if (stateName === 'PLAY') {
            this.tickAccumulator = 0;
            Audio.setAct(this.levelIndex);
            if (this.player) this.player.queued = [];
          }
          if (stateName === 'CLEAR') {
            this.score = Math.max(this.score, 0);
            this.saveProgress();
            Audio.play('levelClear');
          }
          if (stateName === 'DEAD') {
            Audio.play('death');
            this.deaths += 1;
            this.saveProgress();
          }
        },

        saveProgress() {
          if (!SAVE.bestScores) SAVE.bestScores = {};
          if (this.currentLevel) SAVE.bestScores[this.levelIndex] = Math.max(SAVE.bestScores[this.levelIndex] || 0, this.score);
          SAVE.unlockedLevel = Math.max(SAVE.unlockedLevel || 1, this.levelIndex);
          Storage.save(SAVE);
        },

        menuMove(delta) {
          if (this.state !== 'TITLE' && this.state !== 'LORE' && this.state !== 'OPTIONS' && this.state !== 'LEVEL_SELECT') return;
          if (this.state === 'TITLE') {
            const items = ['START CAMPAIGN', 'LEVEL SELECT', 'LORE', 'OPTIONS'];
            this.titleIndex = (this.titleIndex + delta + items.length) % items.length;
            Audio.play('menuMove');
          }
        },

        confirmTitle() {
          if (this.state !== 'TITLE') return;
          const items = ['START CAMPAIGN', 'LEVEL SELECT', 'LORE', 'OPTIONS'];
          const item = items[this.titleIndex];
          if (item === 'START CAMPAIGN') {
            this.levelIndex = 1;
            this.launchLevel(1);
            this.enter('INTRO');
          }
          if (item === 'LEVEL SELECT') this.enter('LEVEL_SELECT');
          if (item === 'LORE') this.enter('LORE');
          if (item === 'OPTIONS') this.enter('OPTIONS');
          Audio.play('menuSelect');
        },

        advanceIntro() {
          if (this.state !== 'INTRO') return;
          this.enter('PLAY');
        },

        queueDirection(dir) {
          if (this.state !== 'PLAY' || !this.player || !this.player.alive) return;
          const map = { left:{x:-1,y:0}, right:{x:1,y:0}, up:{x:0,y:-1}, down:{x:0,y:1} };
          const current = map[this.player.direction];
          const next = map[dir];
          if (next && current && (next.x === -current.x && next.y === -current.y)) return;
          this.player.queueDirection(dir);
          Audio.play('turn', { gain: 0.06, start: 800, end: 700, duration: 0.012 });
        },

        togglePause() {
          if (this.state === 'PLAY') this.enter('PAUSE');
          else if (this.state === 'PAUSE') this.enter('PLAY');
        },

        advanceClear() {
          if (this.state !== 'CLEAR') return;
          if (this.levelIndex >= 12) {
            this.enter('ENDING');
          } else {
            this.levelIndex += 1;
            this.launchLevel(this.levelIndex);
            this.enter('INTRO');
          }
        },

        retry() {
          this.launchLevel(this.levelIndex);
          this.enter('PLAY');
        },

        chooseEnding() {
          if (this.state !== 'ENDING') return;
          this.enter('TITLE');
        },

        launchLevel(levelNumber) {
          const def = Levels.getLevel(levelNumber);
          this.currentLevel = def;
          this.levelIndex = levelNumber;
          this.player = makeSnake({ x: 3, y: 12, dir: 'right', name: 'YOU', palette: ['#8bac0f', '#9bbc0f'], player: true });
          this.rivals = [];
          this.apples = [];
          this.goldenApple = null;
          this.particles = [];
          this.comboLevel = 1;
          this.comboTimer = 0;
          this.lastComboAt = 0;
          this.applesEaten = 0;
          this.deathCause = 'Wall';
          this.goldenTimer = 0;
          this.whisperText = '';
          this.whisperTimer = 0;
          this.screenShake = 0;

          const spawnCount = Math.max(1, def.appleCount || 1);
          for (let i = 0; i < spawnCount; i++) this.spawnApple(false);

          for (const type of def.rivals) {
            const spawn = { x: 20 + (this.rivals.length * 2), y: 12 + (this.rivals.length * 3) };
            const rival = RivalAI.createRival(type, spawn.x, spawn.y);
            rival.typeName = type;
            rival.strategy = type;
            this.rivals.push(rival);
          }
        },

        spawnApple(allowGolden = true) {
          const allSnakes = [this.player, ...this.rivals.filter(Boolean)];
          const walls = this.currentLevel ? this.currentLevel.walls : {};
          const appleList = this.apples.slice();
          const cell = Grid.randomFreeCell(allSnakes.filter(Boolean), walls, appleList);
          const isGolden = allowGolden && Math.random() < CONFIG.GOLDEN_CHANCE;
          const a = { x: cell.x, y: cell.y, golden: isGolden, pulse: Math.random() * Math.PI * 2 };
          if (isGolden) {
            this.goldenApple = a;
            this.goldenTimer = 8000;
          }
          this.apples.push(a);
        },

        addParticles(x, y, color, count) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = rand(0.8, 2.4);
            this.particles.push({
              x: x + 0.5,
              y: y + 0.5,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              maxLife: rand(20, 40),
              size: rand(2, 5),
              color
            });
          }
        },

        collectApple(apple) {
          const i = this.apples.indexOf(apple);
          if (i >= 0) this.apples.splice(i, 1);
          if (apple.golden) {
            this.goldenTimer = 0;
            this.goldenApple = null;
            this.whisperText = 'SOMETHING NOTICED.';
            this.whisperTimer = 5;
            Audio.play('golden');
          }

          const now = performance.now();
          const delta = now - this.lastComboAt;
          if (delta <= CONFIG.COMBO_WINDOW) {
            this.comboLevel = Math.min(CONFIG.MAX_COMBO, this.comboLevel + 1);
          } else {
            this.comboLevel = 1;
          }
          this.lastComboAt = now;
          this.comboTimer = CONFIG.COMBO_WINDOW;

          this.score += Math.round((apple.golden ? 5 : 1) * 10 * this.comboLevel);
          this.applesEaten += 1;
          this.player.grow(CONFIG.GROWTH_PER_APPLE);
          this.screenShake = 8;
          this.addParticles(apple.x, apple.y, apple.golden ? '#d8a13a' : '#9bbc0f', apple.golden ? 16 : 12);
          Audio.play('chomp', { gain: 0.18 + this.comboLevel * 0.05, start: 220 + this.comboLevel * 20, end: 420 + this.comboLevel * 40, duration: 0.06 });

          if (this.applesEaten >= this.currentLevel.applesToClear) {
            this.enter('CLEAR');
            return;
          }

          this.spawnApple(true);
        },

        onDeath(cause) {
          this.deathCause = cause;
          this.whisperText = cause === 'Rival' ? 'IT WAS BUILT TO DO EXACTLY THAT.' : 'THE GARDEN REMEMBERS THAT ONE.';
          this.whisperTimer = 5;
          this.addParticles(this.player.head().x + 0.5, this.player.head().y + 0.5, '#d95353', 22);
          this.screenShake = 16;
          this.enter('DEAD');
        },

        update(dt) {
          if (this.state === 'BOOT') {
            if (performance.now() - this.bootStartedAt > 1500) this.enter('TITLE');
            return;
          }

          if (this.state === 'INTRO') {
            this.revealTimer += dt * 1000;
            if (this.revealTimer > 28) {
              this.revealTimer = 0;
              this.reveal = Math.min(this.reveal + 1, (this.storyText || '').length);
            }
            return;
          }

          if (this.state === 'PLAY') {
            this.tickAccumulator += dt * 1000;
            const tick = this.currentLevel ? this.currentLevel.tick : 150;
            while (this.tickAccumulator >= tick) {
              this.tickAccumulator -= tick;
              this.stepGame();
            }
            this.updateParticles(dt);
            this.comboTimer = Math.max(0, this.comboTimer - dt * 1000);
            if (this.comboTimer <= 0 && this.comboLevel > 1) this.comboLevel = 1;
            if (this.whisperTimer > 0) this.whisperTimer -= dt;
            if (this.goldenTimer > 0) this.goldenTimer -= dt * 1000;
            if (this.goldenTimer <= 0 && this.goldenApple) {
              this.goldenApple = null;
              const idx = this.apples.indexOf(this.goldenApple);
              if (idx >= 0) this.apples.splice(idx, 1);
            }
            return;
          }

          if (this.state === 'CLEAR' || this.state === 'DEAD') {
            this.updateParticles(dt);
            if (this.whisperTimer > 0) this.whisperTimer -= dt;
          }
        },

        stepGame() {
          if (!this.player || !this.player.alive) return;

          const otherSnakes = this.rivals.filter(Boolean);
          const result = this.player.step(this.currentLevel, otherSnakes);
          if (result.dead) {
            this.onDeath(result.cause || 'Wall');
            return;
          }

          if (this.player.head()) {
            for (const apple of this.apples.slice()) {
              if (sameCell(this.player.head(), apple)) {
                this.collectApple(apple);
                break;
              }
            }
          }

          for (const rival of this.rivals) {
            if (!rival || !rival.alive) continue;
            const dir = RivalAI.chooseDirForRival(rival, this.player, this.apples, this.currentLevel, this.rivals);
            rival.queueDirection(dir);
            const rres = rival.step(this.currentLevel, [this.player, ...this.rivals.filter(r2 => r2 && r2 !== rival)]);
            if (rres.dead) {
              rival.alive = false;
              Audio.play('rivalDown');
              this.addParticles(rival.head().x + 0.5, rival.head().y + 0.5, '#d8a13a', 18);
              if (this.player && this.player.alive && sameCell(this.player.head(), rival.head())) {
                this.onDeath('Rival');
              }
            }
            for (const apple of this.apples.slice()) {
              if (sameCell(rival.head(), apple)) {
                rival.grow(CONFIG.GROWTH_PER_APPLE);
                const idx = this.apples.indexOf(apple);
                if (idx >= 0) this.apples.splice(idx, 1);
                this.spawnApple(true);
              }
            }
          }
        },

        updateParticles(dt) {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt * 60;
            p.y += p.vy * dt * 60;
            p.life -= dt * (1.2 + Math.random() * 0.4);
            if (p.life <= 0) this.particles.splice(i, 1);
          }
        },

        render() {
          if (this.state === 'BOOT') this.renderBoot();
          else if (this.state === 'TITLE') this.renderTitle();
          else if (this.state === 'INTRO') this.renderIntro();
          else if (this.state === 'PLAY') this.renderPlay();
          else if (this.state === 'PAUSE') this.renderPause();
          else if (this.state === 'DEAD') this.renderDead();
          else if (this.state === 'CLEAR') this.renderClear();
          else if (this.state === 'ENDING') this.renderEnding();
          else if (this.state === 'LORE') this.renderLore();
          else if (this.state === 'OPTIONS') this.renderOptions();
          else if (this.state === 'LEVEL_SELECT') this.renderLevelSelect();
        },

        renderBoot() {
          ctx.fillStyle = '#071208';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#9bbc0f';
          ctx.font = 'bold 30px monospace';
          ctx.fillText('EDEN v0.9', 120, 170);
          ctx.fillText('MEMORY 62%', 120, 220);
          ctx.fillText('SNAKES: 5', 120, 270);
          ctx.fillText('OK', 120, 320);
        },

        renderTitle() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#9bbc0f';
          ctx.font = 'bold 30px monospace';
          ctx.fillText('SERPENT PROTOCOL', 240, 150);
          ctx.font = '18px monospace';
          ctx.fillText('GARDEN OF EDEN', 330, 190);
          const items = ['START CAMPAIGN', 'LEVEL SELECT', 'LORE', 'OPTIONS'];
          for (let i = 0; i < items.length; i++) {
            const y = 270 + i * 46;
            ctx.fillStyle = (i === this.titleIndex) ? '#e8f0d8' : '#9bbc0f';
            ctx.fillText(items[i], 290, y);
          }
          ctx.fillStyle = '#e8f0d8';
          ctx.fillText('PRESS SPACE', 330, 560);
        },

        renderIntro() {
          const lvl = Levels.getLevel(this.levelIndex);
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 22px monospace';
          ctx.fillText('LEVEL ' + lvl.id, 110, 130);
          ctx.fillText(lvl.name.toUpperCase(), 110, 170);
          ctx.fillStyle = '#9bbc0f';
          ctx.fillText('SPEED', 110, 225);
          ctx.fillStyle = '#306230';
          ctx.fillRect(230, 205, 220, 18);
          const ratio = 1 - ((lvl.tick - 75) / 120);
          ctx.fillStyle = '#9bbc0f';
          ctx.fillRect(230, 205, 220 * ratio, 18);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = '16px monospace';
          ctx.fillText('HAZARD: ' + lvl.hazard, 110, 280);
          ctx.fillText('RIVALS: ' + (lvl.rivals.length ? lvl.rivals.join(' ') : 'NONE'), 110, 310);
          const story = lvl.story;
          ctx.fillStyle = '#9bbc0f';
          const visible = story.slice(0, this.reveal);
          ctx.fillText(visible, 110, 370, 680);
          ctx.fillStyle = '#e8f0d8';
          ctx.fillText('PRESS SPACE', 350, 500);
          if (this.deaths > 0) ctx.fillText('DEATHS: ' + this.deaths, 110, 430);
        },

        renderPlay() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // playfield border
          ctx.strokeStyle = '#306230';
          ctx.lineWidth = 3;
          ctx.strokeRect(CONFIG.PLAY_X - 4, CONFIG.PLAY_Y - 4, CONFIG.BOARD_W + 8, CONFIG.BOARD_H + 8);

          // subtle grid
          ctx.fillStyle = '#183d18';
          for (let x = 0; x < CONFIG.COLS; x++) {
            for (let y = 0; y < CONFIG.ROWS; y++) {
              const px = CONFIG.PLAY_X + x * CONFIG.CELL;
              const py = CONFIG.PLAY_Y + y * CONFIG.CELL;
              if ((x + y) % 2 === 0) ctx.fillRect(px + 7, py + 7, 2, 2);
            }
          }

          // draw walls
          const walls = this.currentLevel ? this.currentLevel.walls : {};
          for (const x in walls) {
            for (const y in walls[x]) {
              const px = CONFIG.PLAY_X + Number(x) * CONFIG.CELL;
              const py = CONFIG.PLAY_Y + Number(y) * CONFIG.CELL;
              ctx.fillStyle = '#306230';
              ctx.fillRect(px + 1, py + 1, CONFIG.CELL - 2, CONFIG.CELL - 2);
            }
          }

          // apples
          for (const apple of this.apples) {
            const px = CONFIG.PLAY_X + apple.x * CONFIG.CELL + CONFIG.CELL / 2;
            const py = CONFIG.PLAY_Y + apple.y * CONFIG.CELL + CONFIG.CELL / 2;
            const pulse = 1 + Math.sin(performance.now() * 0.025 + apple.pulse) * 0.15;
            ctx.save();
            ctx.translate(px, py);
            ctx.scale(pulse, pulse);
            ctx.fillStyle = apple.golden ? '#d8a13a' : '#9bbc0f';
            ctx.beginPath();
            ctx.arc(0, 0, apple.golden ? 7 : 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = apple.golden ? '#f4d67d' : '#e8f0d8';
            ctx.fillRect(-2, -4, 4, 8);
            ctx.restore();
          }

          // snake bodies
          const allSnakes = [this.player, ...this.rivals];
          for (const snake of allSnakes) {
            if (!snake || !snake.alive) continue;
            const palette = snake.palette || ['#9bbc0f', '#8bac0f'];
            for (let i = 0; i < snake.body.length; i++) {
              const seg = snake.body[i];
              const px = CONFIG.PLAY_X + seg.x * CONFIG.CELL;
              const py = CONFIG.PLAY_Y + seg.y * CONFIG.CELL;
              ctx.fillStyle = i === 0 ? '#e8f0d8' : (i % 2 === 0 ? palette[0] : palette[1]);
              ctx.fillRect(px + 1, py + 1, CONFIG.CELL - 2, CONFIG.CELL - 2);

              if (i === 0 && snake.player) {
                const dir = snake.direction;
                const eyeX = dir === 'left' ? px + 4 : dir === 'right' ? px + CONFIG.CELL - 8 : px + 6;
                const eyeY = dir === 'up' ? py + 4 : dir === 'down' ? py + CONFIG.CELL - 8 : py + 6;
                ctx.fillStyle = '#0f380f';
                ctx.fillRect(eyeX, eyeY, 2, 2);
                const eye2X = dir === 'left' ? px + 4 : dir === 'right' ? px + CONFIG.CELL - 8 : px + 12;
                const eye2Y = dir === 'up' ? py + 4 : dir === 'down' ? py + CONFIG.CELL - 8 : py + 12;
                ctx.fillRect(eye2X, eye2Y, 2, 2);
              }
            }
          }

          // particles
          for (const p of this.particles) {
            ctx.globalAlpha = clamp(p.life, 0, 1);
            ctx.fillStyle = p.color;
            ctx.fillRect(CONFIG.PLAY_X + p.x * CONFIG.CELL, CONFIG.PLAY_Y + p.y * CONFIG.CELL, p.size, p.size);
            ctx.globalAlpha = 1;
          }

          // HUD
          ctx.fillStyle = '#9bbc0f';
          ctx.font = 'bold 18px monospace';
          ctx.fillText('SCORE ' + this.score, 30, 35);
          ctx.fillText((this.currentLevel ? this.currentLevel.name.toUpperCase() : 'LEVEL'), 390, 35);
          ctx.fillText('APPLES ' + this.applesEaten + '/' + this.currentLevel.applesToClear, 700, 35);

          ctx.fillStyle = '#306230';
          ctx.fillRect(30, 50, 180, 12);
          ctx.fillStyle = '#9bbc0f';
          ctx.fillRect(30, 50, 180 * (this.comboTimer / CONFIG.COMBO_WINDOW), 12);
          ctx.fillText('x' + this.comboLevel, 30, 80);

          // rival panel
          ctx.fillStyle = '#132d17';
          ctx.fillRect(560, 110, 300, 440);
          ctx.strokeStyle = '#9bbc0f';
          ctx.strokeRect(560, 110, 300, 440);
          ctx.fillStyle = '#9bbc0f';
          ctx.font = '16px monospace';
          ctx.fillText('RIVALS', 590, 140);
          for (let i = 0; i < this.rivals.length; i++) {
            const r = this.rivals[i];
            const y = 170 + i * 52;
            ctx.fillStyle = r.alive ? '#9bbc0f' : '#7d7d55';
            ctx.fillText((r.alive ? '•' : '✕') + ' ' + r.name, 590, y);
            ctx.fillText('LEN ' + r.length(), 725, y);
          }

          // whisper
          if (this.whisperTimer > 0 && this.whisperText) {
            ctx.fillStyle = 'rgba(155,188,15,0.9)';
            ctx.fillRect(170, 25, 620, 26);
            ctx.fillStyle = '#0f380f';
            ctx.fillText(this.whisperText, 190, 43);
          }
        },

        renderPause() {
          this.renderPlay();
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 28px monospace';
          ctx.fillText('PAUSED', 390, 300);
          ctx.font = '18px monospace';
          ctx.fillText('RESUME / RESTART / QUIT', 310, 360);
        },

        renderDead() {
          this.renderPlay();
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 28px monospace';
          ctx.fillText('YOU DIED', 370, 220);
          ctx.font = '18px monospace';
          ctx.fillText('CAUSE: ' + this.deathCause, 280, 260);
          ctx.fillText('SCORE: ' + this.score, 280, 290);
          ctx.fillText('APPLES: ' + this.applesEaten, 280, 320);
          ctx.fillText('LEVEL: ' + this.levelIndex, 280, 350);
          ctx.fillText('RETRY', 280, 420);
          ctx.fillText('LEVEL SELECT', 280, 450);
          ctx.fillText('TITLE', 280, 480);
        },

        renderClear() {
          this.renderPlay();
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 28px monospace';
          ctx.fillText('LEVEL CLEAR', 360, 220);
          ctx.font = '18px monospace';
          ctx.fillText('SCORE: ' + this.score, 300, 270);
          ctx.fillText('APPLES: ' + this.applesEaten, 300, 300);
          ctx.fillText('BEST: ' + (SAVE.bestScores[this.levelIndex] || 0), 300, 330);
          ctx.fillText('CONTINUE', 360, 420);
        },

        renderEnding() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 28px monospace';
          ctx.fillText('THE LAST APPLE', 300, 200);
          ctx.font = '18px monospace';
          ctx.fillText('CONSUME', 300, 270);
          ctx.fillText('REFUSE', 300, 310);
          ctx.fillText('PRESS SPACE', 330, 420);
        },

        renderLore() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 24px monospace';
          ctx.fillText('LORE LOG', 380, 80);
          ctx.font = '16px monospace';
          const whispers = SAVE.lore || [];
          if (!whispers.length) {
            ctx.fillText('THE GARDEN IS QUIET.', 250, 170);
          } else {
            for (let i = 0; i < whispers.length; i++) {
              ctx.fillText(whispers[i], 110, 150 + i * 28);
            }
          }
          ctx.fillText('ESC TO RETURN', 350, 620);
        },

        renderOptions() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 26px monospace';
          ctx.fillText('OPTIONS', 390, 90);
          ctx.font = '18px monospace';
          const items = [
            'VOLUME: ' + (SAVE.settings.volume || 0.8),
            'SFX: ' + (SAVE.settings.sfx || 0.8),
            'SHAKE: ' + (SAVE.settings.shake ? 'ON' : 'OFF'),
            'SCANLINES: ' + (SAVE.settings.scanlines ? 'ON' : 'OFF'),
            'DIFFICULTY: ' + (SAVE.settings.difficulty || 'normal'),
            'RESET PROGRESS'
          ];
          for (let i = 0; i < items.length; i++) {
            ctx.fillText(items[i], 250, 150 + i * 40);
          }
        },

        renderLevelSelect() {
          ctx.fillStyle = '#0f380f';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#e8f0d8';
          ctx.font = 'bold 26px monospace';
          ctx.fillText('LEVEL SELECT', 330, 90);
          ctx.font = '18px monospace';
          for (let i = 1; i <= 12; i++) {
            const x = 150 + ((i - 1) % 3) * 220;
            const y = 150 + Math.floor((i - 1) / 3) * 80;
            ctx.fillText(i + ' ' + Levels.list[i - 1].name.toUpperCase(), x, y);
          }
        }
      };

      window.Game = Game;
      window.Audio = Audio;
      Audio.ensureContext();
      Game.launchLevel(1);
      Game.enter('BOOT');
      function loop(ts) {
        const dt = Math.min(0.033, (ts - (Game.lastTime || ts)) / 1000 || 0.016);
        Game.lastTime = ts;
        Game.update(dt);
        Game.render();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
